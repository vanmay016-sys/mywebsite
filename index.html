<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yến ❤️ 安</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="petals"></div>

<div class="container">

<h1>
❤️ Yến & 安 ❤️
</h1>

<h2>
我们的爱情故事
<br>
( Câu chuyện tình yêu của chúng ta )
</h2>


<div class="love-time">

❤️ 我们已经相爱 ❤️

<div id="timer">
</div>

</div>


<div class="photo-box">

<img src="16630.jpeg"
id="photo">

<p>
📷 Thay ảnh của hai bạn ở đây
</p>

</div>


<button onclick="openLetter()">
💌 打开情书
</button>


<div id="letter">

<p>

亲爱的 安：

<br><br>

谢谢你出现在我的生命里。

<br>

从2026年6月20日开始，

我的世界因为有你变得更加幸福。

<br><br>

希望未来的日子，

我们可以一起看风景，

一起面对困难，

一起走向未来。

<br><br>

余生请多指教。

<br><br>

❤️ 嫁给我吧 ❤️

</p>


<div class="choice">

<button onclick="yesLove()">
💍 愿意
</button>


<button id="noBtn">
😜 不愿意
</button>


</div>

</div>


<div id="result">

❤️ 我们永远在一起 ❤️

</div>


</div>

<audio id="music" loop>
    <source src="paulyudin-romantic-love-piano-valentines-day-164819.mp3" type="audio/mp3">
</audio>

<!-- Sau này bạn thay nhạc vào đây -->

</audio>


<script src="script.js"></script>


</body>

</html>
